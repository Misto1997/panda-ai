- id: pop_1
  category: period_over_period
  turns:
  - Compare net gmv by zone last 7 days vs the previous 7 days
  xfail_mock: the mock's intent extraction has no period-comparison concept, so it answers only the current period
  sql: WITH c AS (SELECT zone, SUM(net_gmv) AS cur FROM fact_sales WHERE order_date >= DATE '2026-09-24' AND order_date < DATE '2026-10-01' GROUP BY 1), p AS (SELECT zone, SUM(net_gmv) AS prev FROM fact_sales
    WHERE order_date >= DATE '2026-09-17' AND order_date < DATE '2026-09-24' GROUP BY 1) SELECT zone, cur, prev, (cur - prev) / prev AS pct_change FROM c JOIN p USING (zone)
- id: pop_2
  category: period_over_period
  turns:
  - orders last 7 days vs previous 7 days
  xfail_mock: the mock's intent extraction has no period-comparison concept, so it answers only the current period
  sql: SELECT SUM(CASE WHEN order_date >= DATE '2026-09-24' THEN orders END) AS cur, SUM(CASE WHEN order_date < DATE '2026-09-24' THEN orders END) AS prev FROM fact_sales WHERE order_date >= DATE '2026-09-17'
    AND order_date < DATE '2026-10-01'
- id: pop_3
  category: period_over_period
  turns:
  - net gmv growth by marketplace week over week
  xfail_mock: the mock's intent extraction has no period-comparison concept, so it answers only the current period
  sql: WITH c AS (SELECT marketplace, SUM(net_gmv) AS cur FROM fact_sales WHERE order_date >= DATE '2026-09-24' AND order_date < DATE '2026-10-01' GROUP BY 1), p AS (SELECT marketplace, SUM(net_gmv) AS
    prev FROM fact_sales WHERE order_date >= DATE '2026-09-17' AND order_date < DATE '2026-09-24' GROUP BY 1) SELECT marketplace, (cur - prev) / prev AS growth FROM c JOIN p USING (marketplace)
