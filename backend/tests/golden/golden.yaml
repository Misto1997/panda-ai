- id: multi_1
  category: multi_table
  turns:
  - net gmv and visits by marketplace last 7 days
  sql: WITH s AS (SELECT marketplace, SUM(net_gmv) AS net_gmv FROM fact_sales WHERE order_date >= DATE '2026-09-24' AND order_date < DATE '2026-10-01' GROUP BY 1), t AS (SELECT marketplace, SUM(visits)
    AS visits FROM agg_traffic_city_daily WHERE visit_date >= DATE '2026-09-24' AND visit_date < DATE '2026-10-01' GROUP BY 1) SELECT s.marketplace, s.net_gmv, t.visits FROM s JOIN t USING (marketplace)
